<body><div class="app"><header class="top"><div class="brand">Photo Selector</div><div class="toolbar"><button id="openSource" class="primary">사진 불러오기</button><button id="fullscreenToggle" title="전체화면">⛶ 전체화면</button></div><div class="status" id="status">폴더를 열어 시작하세요</div></header>
<main class="layout"><section class="viewer"><div class="stage" id="stage"><div class="placeholder"><strong>사진 셀렉트를 시작해보세요</strong>사진 폴더를 열면 하위 폴더까지 JPG를 찾아 보여줍니다.<br>브라우저가 폴더 접근 권한을 요청합니다.</div></div><div class="caption" id="caption" hidden><div style="min-width:0;flex:1"><div class="filename" id="filename"></div><div class="sub" id="fileinfo"></div></div><div class="stars" id="stars" aria-label="별점"></div></div></section><aside class="side"><div class="sidehead"><h2>검토한 사진 <span id="count"></span></h2><div class="filters"><button data-filter="all" class="active">전체</button><button data-filter="liked">♥ 하트</button><button data-filter="rated">★ 별점</button><button data-filter="unrated">미검토</button></div><div class="mobile-review-controls"><button id="mobileHeart" aria-label="하트 표시">♡</button><div id="mobileStars" aria-label="별점 설정"></div><select id="mobileFilter" aria-label="사진 필터"><option value="all">전체</option><option value="liked">♥ 하트</option><option value="rated">★ 별점</option><option value="unrated">미검토</option></select></div></div><div class="list" id="list"></div><div class="actionbox"><div class="small" id="selectionInfo">선택 사진과 연결된 파일이 대상입니다.</div><select id="operation"><option value="copy">복사</option><option value="move">이동</option></select><div class="filetypes"><label><input id="includeJpg" type="checkbox" checked> JPG 포함</label><label><input id="includeRaw" type="checkbox"> RAW 포함</label></div><button id="runAction" class="primary" disabled>선택 파일 복사</button><div class="small">대상 폴더에 같은 이름이 있으면 건너뜁니다.</div></div></aside></main></div><div class="notice" id="notice"></div>
<script>
const RAW_EXT=new Set(['.cr2','.cr3','.nef','.arw','.dng','.raf','.rw2','.orf','.pef','.srw','.3fr','.iiq','.kdc','.erf','.mos','.mrw','.nrw','.rwl']);
const IMG_EXT=new Set(['.jpg','.jpeg']);let rootHandle=null,destHandle=null,items=[],viewItems=[],index=0,filter='all',urls=new Map(),scanToken=0,zoom=1,panX=0,panY=0,dragState=null,thumbObserver=null;
const $=id=>document.getElementById(id);const extOf=n=>{const i=n.lastIndexOf('.');return i<0?'':n.slice(i).toLowerCase()};const baseOf=n=>n.slice(0,n.lastIndexOf('.')).toLowerCase();
function toast(t){const n=$('notice');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2800)}
function setStatus(t){$('status').textContent=t}
function db(){return new Promise((resolve,reject)=>{const q=indexedDB.open('photo-select-v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('reviews');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function getReviews(){if(!rootHandle)return {};try{const h=await rootHandle.getFileHandle('work_data.json');const saved=JSON.parse(await (await h.getFile()).text());if(saved.format==='photo-select-work-data'&&saved.reviews)return saved.reviews}catch(e){if(e.name!=='NotFoundError')console.warn('work_data.json을 읽을 수 없습니다',e)}const d=await db();const tx=d.transaction('reviews','readonly');return new Promise(resolve=>{const q=tx.objectStore('reviews').get(rootHandle.name);q.onsuccess=()=>resolve(q.result||{});q.onerror=()=>resolve({})})}
async function saveReviews(){if(!rootHandle)return;const reviews=Object.fromEntries(items.map(x=>[x.key,{liked:x.liked,rating:x.rating}]));try{const d=await db();const tx=d.transaction('reviews','readwrite');tx.objectStore('reviews').put(reviews,rootHandle.name);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}catch(e){console.warn(e)}try{const h=await rootHandle.getFileHandle('work_data.json',{create:true});const writer=await h.createWritable();await writer.write(JSON.stringify({format:'photo-select-work-data',version:1,rootFolder:rootHandle.name,updatedAt:new Date().toISOString(),reviews},null,2));await writer.close()}catch(e){console.warn('work_data.json을 저장하지 못했습니다',e);toast('하트·별점은 저장했지만 work_data.json 파일에 기록하지 못했습니다')}}
async function scan(){const token=++scanToken;items=[];const reviews=await getReviews();let dirs=0,scanned=0;async function walk(dir,rel=''){const files=[];for await(const [name,h] of dir.entries()){if(token!==scanToken)return;if(h.kind==='directory'){dirs++;await walk(h,rel+name+'/')}else{files.push({name,handle:h,rel});scanned++;if(scanned%300===0){setStatus(`검색 중 · ${scanned.toLocaleString()}개 파일 확인`);await new Promise(requestAnimationFrame)}}}const rawsByBase=new Map;for(const f of files){if(RAW_EXT.has(extOf(f.name))){const key=baseOf(f.name);if(!rawsByBase.has(key))rawsByBase.set(key,[]);rawsByBase.get(key).push(f)}}for(const f of files){if(IMG_EXT.has(extOf(f.name))){const key=rel+f.name;items.push({key,name:f.name,rel,handle:f.handle,liked:reviews[key]?.liked||false,rating:reviews[key]?.rating||0,raws:rawsByBase.get(baseOf(f.name))||[]})}}}await walk(rootHandle);if(token!==scanToken)return;items.sort((a,b)=>a.rel.localeCompare(b.rel)||a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'}));index=0;await saveReviews();renderList();if(items.length){await showItem(0);setStatus(`${items.length}장 · ${scanned.toLocaleString()}개 파일 검색됨 · work_data.json 자동 저장`)}else{setStatus('JPG 파일을 찾지 못했습니다 · work_data.json 자동 저장');$('stage').innerHTML='<div class="placeholder"><strong>JPG 파일이 없습니다</strong>선택한 폴더와 하위 폴더에 JPG 또는 JPEG 파일이 있는지 확인하세요.</div>';$('caption').hidden=true}}
function currentFiltered(){return items.filter(x=>filter==='all'||(filter==='liked'&&x.liked)||(filter==='rated'&&x.rating>0)||(filter==='unrated'&&!x.liked&&!x.rating))}
async function loadThumb(img,it){if(img.dataset.loading||img.dataset.ready)return;img.dataset.loading='1';try{if(!it._file)it._file=await it.handle.getFile();if(img.isConnected){img.src=getUrl(it);img.dataset.ready='1'}}catch(e){img.dataset.loading='';}}
function renderList(){viewItems=currentFiltered();$('count').textContent=`${viewItems.length}/${items.length}`;$('list').innerHTML='';if(thumbObserver)thumbObserver.disconnect();thumbObserver='IntersectionObserver'in window?new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){thumbObserver.unobserve(e.target);loadThumb(e.target,e.target._photo)}},{root:$('list'),rootMargin:'240px'}):null;for(const it of viewItems){const row=document.createElement('div');row.className='item'+(it===viewItems[index]?' selected':'');row.onclick=()=>showItem(viewItems.indexOf(it));const img=document.createElement('img');img.className='thumb';img.alt='';img._photo=it;if(thumbObserver)thumbObserver.observe(img);else loadThumb(img,it);const details=document.createElement('div');details.innerHTML=`<div class="itemname" title="${esc(it.rel+it.name)}">${esc(it.name)}</div><div class="itemmeta">${it.rel?esc(it.rel):'루트'} ${it.rating?'· '+'★'.repeat(it.rating):''}</div>`;const heart=document.createElement('span');heart.className='itemheart';heart.textContent=it.liked?'♥':'';row.append(img,details,heart);$('list').append(row)}preloadNeighborThumbs(index);updateAction()}
function preloadNeighborThumbs(center=index){if(!viewItems.length)return;const tasks=[];for(let d=-3;d<=3;d++){if(d===0)continue;const i=(center+d+viewItems.length)%viewItems.length,it=viewItems[i],row=$('list').children[i],img=row?.querySelector('img.thumb');if(img)tasks.push(loadThumb(img,it))}void Promise.all(tasks)}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getUrl(it){if(!urls.has(it.key))urls.set(it.key,URL.createObjectURL(it._file));return urls.get(it.key)}
async function showItem(i){if(!viewItems.length)return;index=(i+viewItems.length)%viewItems.length;zoom=1;panX=panY=0;const it=viewItems[index];renderList();if(!it._file)it._file=await it.handle.getFile();$('stage').innerHTML=`<img alt="${esc(it.name)}" src="${getUrl(it)}"><div class="zoomtools"><button id="zoomOut" title="축소">−</button><span class="zoomlabel" id="zoomLabel">100%</span><button id="zoomIn" title="확대">+</button><button id="zoomFit" title="화면에 맞춤" aria-label="화면에 맞춤"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M8 8h8v8H8z"/></svg></button></div><div class="nav"><button id="prev" title="이전 사진 (↑)">‹</button><button id="next" title="다음 사진 (↓)">›</button></div><button class="heart ${it.liked?'on':''}" id="heart" title="스페이스바로 하트 표시/해제">${it.liked?'♥':'♡'}</button>`;setZoom(1);$('prev').onclick=()=>showItem(index-1);$('next').onclick=()=>showItem(index+1);$('zoomOut').onclick=()=>setZoom(zoom-.25);$('zoomIn').onclick=()=>setZoom(zoom+.25);$('zoomFit').onclick=()=>setZoom(1);$('stage').onwheel=e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(zoom+(e.deltaY<0?.15:-.15));clampPan()}};$('stage').onpointerdown=e=>{if(zoom<=1||e.target.closest('button'))return;const img=$('stage').querySelector('img');dragState={x:e.clientX,y:e.clientY,panX,panY};img.classList.add('dragging');$('stage').setPointerCapture(e.pointerId)};$('stage').onpointermove=e=>{if(!dragState)return;panX=dragState.panX+e.clientX-dragState.x;panY=dragState.panY+e.clientY-dragState.y;clampPan()};$('stage').onpointerup=$('stage').onpointercancel=e=>{dragState=null;$('stage').querySelector('img')?.classList.remove('dragging')};$('heart').onclick=()=>toggleLike(it);$('caption').hidden=false;$('filename').textContent=it.name;$('fileinfo').textContent=`${it.rel||'루트'} · ${formatSize(it._file.size)} · RAW ${it.raws.length?'연결됨 ('+it.raws.map(r=>r.name).join(', ')+')':'없음'}`;$('stars').innerHTML='';$('mobileStars').innerHTML='';$('mobileHeart').textContent=it.liked?'♥':'♡';$('mobileHeart').classList.toggle('on',it.liked);for(let n=1;n<=5;n++){const b=document.createElement('button');b.className='star'+(n<=it.rating?' on':'');b.textContent='★';b.title=`${n}점 지정`;b.onclick=()=>setRating(it,n);$('stars').append(b);const mb=document.createElement('button');mb.dataset.rating=n;mb.textContent='★';mb.className=n<=it.rating?'on':'';$('mobileStars').append(mb)}const rows=[...$('list').children];rows[index]?.scrollIntoView({block:'nearest'})}
function setZoom(value){zoom=Math.max(1,Math.min(5,Math.round(value*100)/100));if(zoom===1)panX=panY=0;const stage=$('stage');stage.style.setProperty('--zoom',zoom);stage.style.setProperty('--pan-x',`${panX}px`);stage.style.setProperty('--pan-y',`${panY}px`);const label=$('zoomLabel');if(label)label.textContent=`${Math.round(zoom*100)}%`}
function clampPan(){const img=$('stage').querySelector('img');if(!img)return;const maxX=Math.max(0,(img.offsetWidth*zoom-$('stage').clientWidth)/2),maxY=Math.max(0,(img.offsetHeight*zoom-$('stage').clientHeight)/2);panX=Math.max(-maxX,Math.min(maxX,panX));panY=Math.max(-maxY,Math.min(maxY,panY));$('stage').style.setProperty('--pan-x',`${panX}px`);$('stage').style.setProperty('--pan-y',`${panY}px`)}
function installRegionZoom(){
 const stage=$('stage'),img=stage.querySelector('img');if(!img)return;
 img.title='두 손가락 핀치: 확대/축소 · 확대 후 한 손가락 드래그: 이동 · Ctrl+드래그: 영역 확대';
 let gesture=null,box=null;const pointers=new Map();
 const point=e=>({x:e.clientX,y:e.clientY});
 const midpoint=()=>{const a=[...pointers.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}};
 const gap=()=>{const a=[...pointers.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
 stage.onpointerdown=e=>{
  if(e.target.closest('button'))return;
  if(e.pointerType==='touch'){
   pointers.set(e.pointerId,point(e));try{stage.setPointerCapture(e.pointerId)}catch{}
   if(pointers.size===2){const m=midpoint(),r=stage.getBoundingClientRect();gesture={mode:'pinch',distance:Math.max(1,gap()),zoom,panX,panY,midX:m.x-r.left,midY:m.y-r.top};}
   else if(pointers.size===1&&zoom>1)gesture={mode:'pan',x:e.clientX,y:e.clientY,panX,panY};else if(pointers.size===1)gesture={mode:'swipe',x:e.clientX,y:e.clientY};
   e.preventDefault();return;
